# These tests spawn bounded subprocess workloads. Reserve the global thread
# budget as well as serializing the group, so other workspace tests cannot load
# a running campaign. This also covers test-only raw-provider campaigns.
[test-groups.code-memory-stress]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(x86jit-cranelift) & (binary(code_memory_stress) | binary(code_memory_fault_stress) | binary(code_memory_bound) | test(code_memory::tests::repeated_) | test(batch_tests::repeated_automatic_reclamation_bounds_all_metadata_including_ibtc))'
test-group = 'code-memory-stress'
threads-required = 'num-test-threads'

# Test tiers (backlog/docs/commands.md § Test tiers). Overrides of the default
# profile, such as the group above, apply to every profile.
#
# The full tier: everything except fuzz_robustness (scripts/ci-gate.sh tests adds
# the filter), with a JUnit report that scripts/test-tiers.py ratchet reads.
[profile.ci.junit]
path = "junit.xml"

# The heavy tier: fuzz_robustness and the ignored soaks. Run with --run-ignored all
# (scripts/ci-gate.sh heavy); off the path to main.
[profile.heavy]
default-filter = '''
binary(fuzz_robustness)
| (binary_id(=x86jit-cranelift::code_memory_stress) & test(=dense_reclamation_soak))
| (binary_id(=x86jit-cranelift::code_memory_bound) & test(=hundred_thousand_units_have_bounded_mappings_and_residency))
'''

# The fast tier: the local hand-back gate.
[profile.fast.junit]
path = "junit.xml"

