name: CI

# Manual only (workflow_dispatch). It runs on the project's Forgejo Actions runner:
# an x86-64 Linux host whose `ubuntu-latest` label runs each job in a
# node:20-bookworm container without systemd. On x86-64 the "native" leg of the
# whole-program tests executes the guest ELF directly, so this is the full
# three-way check (native == interp == JIT). It is also the only place the
# x86-64 host paths run for real: the signal-context landing stub, the usercopy
# fixup routines and the Linux ucontext adapters.
#
# There is no native aarch64 leg. The aarch64 gate runs locally on an aarch64
# macOS host (backlog/docs/commands.md § Git remote and CI). The FreeBSD lane
# type-checks both architectures on this Linux runner; it runs no FreeBSD code.
#
# Actions resolve against the runner's default action mirror unless given as a
# full URL. Nix is installed by the installer binary directly, not by an action,
# because the container has no init system and the job runs as root.
#
# Once the dev shell is up, every gate step runs even if an earlier one failed, and
# tees its output into ci-logs/<step>.log. The last step reports the outcome as a
# commit status (context "ci / x86_64"): on failure its description lists each
# failing step with its failing tests, or its error lines, so the result is
# readable through the API without opening the job log.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
      RUSTC_WRAPPER: ""
    steps:
      # Nothing after checkout needs git credentials, so do not leave the job token
      # in .git/config next to unsandboxed builds.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        id: nix
        env:
          # The installer's telemetry is off.
          NIX_INSTALLER_DIAGNOSTIC_ENDPOINT: ""
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          # A pinned installer release. `--init none`: the container has no
          # systemd, so no daemon; root uses the store directly. The build sandbox
          # needs namespaces an unprivileged container does not grant.
          {
            curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix/tag/v3.24.1 \
              | sh -s -- install linux --init none --no-confirm \
                  --extra-conf "sandbox = false" --extra-conf "filter-syscalls = false"
          } 2>&1 | tee ci-logs/nix.log
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"

      - name: Dev shell
        id: devshell
        run: |
          set -o pipefail
          nix develop --command rustc --version 2>&1 | tee ci-logs/devshell.log

      # Restore compiled dependencies (unicorn-engine, cranelift, …) and the cargo
      # registry. Keyed on the toolchain pin (flake.lock) and Cargo.lock; source-only
      # commits keep the same key, so only the workspace crates recompile. Saved by
      # the matching step near the end, also when the job is red.
      - name: Restore cargo cache
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-x86_64-${{ hashFiles('flake.lock') }}-

      # The 80286 corpus is the only hardware-captured oracle here — real silicon, not
      # another emulator. It is pinned by commit, so this cache is fetched once ever and
      # the key changes only when the pin moves deliberately.
      - name: Restore 80286 corpus cache
        id: corpus_cache
        uses: actions/cache/restore@v4
        with:
          path: x86jit-tests/vendor/80286/v1_real_mode
          key: ss286-${{ hashFiles('x86jit-tests/vendor/80286/fetch.sh') }}

      - name: Fetch 80286 corpus
        id: corpus
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          ./x86jit-tests/vendor/80286/fetch.sh 2>&1 | tee ci-logs/corpus.log

      - name: Formatting
        id: fmt
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --command cargo fmt --all --check 2>&1 | tee ci-logs/fmt.log

      - name: Guest-agnostic guard
        id: guard
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          ./scripts/guest-agnostic-guard.sh 2>&1 | tee ci-logs/guard.log

      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --command cargo clippy --workspace --all-targets --features x86jit-tests/unicorn -- -D warnings 2>&1 | tee ci-logs/clippy.log

      # The pinned stable Nix toolchain includes both FreeBSD standard libraries.
      # Default features: no cross-built Unicorn library or FreeBSD linker needed.
      # Runtime coverage remains with embedders until a FreeBSD runner exists.
      - name: FreeBSD compile-check lane (aarch64)
        id: freebsd_aarch64
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: bash scripts/ci-gate.sh cross aarch64-unknown-freebsd

      - name: FreeBSD compile-check lane (x86_64)
        id: freebsd_x86_64
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: bash scripts/ci-gate.sh cross x86_64-unknown-freebsd

      # Turns PROVENANCE.md §5's licence claim into a gate. `--all-features` on purpose:
      # the default resolution hides the Unicorn oracle and its bindgen build tree, so a
      # default-only run passes over a graph CI does not actually build.
      - name: Licences (cargo-deny)
        id: deny
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --command cargo deny --all-features check licenses bans sources 2>&1 | tee ci-logs/deny.log

      # Skip the fuzz_robustness binary: two random-bytes-never-panic tests that each
      # run >7 min by design — they dominate the wall clock and add nothing a
      # deterministic run catches. Run them on demand locally
      # (`cargo nextest run -E 'binary(fuzz_robustness)'`).
      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        env:
          RUST_BACKTRACE: "1"
          # Absence of the corpus is a failure here, never a silent skip.
          SS286_REQUIRED: "1"
        run: |
          set -o pipefail
          nix develop --command cargo nextest run --workspace --features x86jit-tests/unicorn --no-fail-fast --success-output final -E 'not binary(fuzz_robustness)' 2>&1 | tee ci-logs/tests.log

      # Release-profile leg. Everything above builds the dev profile, so every test
      # exercises x86jit-core at opt-level 0 and an optimization-only defect cannot be
      # caught by any of them. That is not hypothetical: an LLVM i128 miscompile in the
      # vector float move produced a wrong result only under optimization, and its
      # regression test passed under `cargo test` while failing under
      # `cargo test --release` on the same tree.
      #
      # Deliberately a subset, not the whole suite: the unicorn oracle and the fuzz
      # campaigns dominate the wall clock and are profile-independent. What this leg
      # is for is codegen, the softfloat paths and the host-fault recovery paths
      # (landing stub, region fault state, usercopy fixups), where the optimizer is
      # the variable.
      - name: Tests (release profile)
        id: release
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          nix develop --command cargo nextest run --release -p x86jit-tests --no-fail-fast --success-output final \
            -E 'binary(jit) or binary(differential) or binary(corpus) or binary(smc) or binary(mt) or binary(fault_landing_pad) or binary(region_fault_state) or binary(rust_memory_faults)' \
            2>&1 | tee ci-logs/release.log

      # 32-bit differential lane: the Compat32 interpreter vs Unicorn UC_MODE_32, plus
      # the Compat32 fuzz lanes (jit/unicorn-vs-interp). The whole-workspace run above
      # already includes these, but this named step makes the 32-bit lane a
      # first-class, independently-visible CI check. Every case in the lane runs; none
      # is #[ignore]d.
      - name: 32-bit differential lane (Compat32)
        id: lane32
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          nix develop --command cargo nextest run -p x86jit-tests --features unicorn --no-fail-fast --success-output final \
            -E 'binary(differential32) or (binary(fuzz) and (test(jit_matches_interp_32) or test(unicorn_matches_interp_32)))' \
            2>&1 | tee ci-logs/lane32.log

      # actions/cache saves only on success; these explicit saves keep the caches warm
      # while the job is red.
      - name: Save cargo cache
        if: ${{ always() && steps.devshell.outcome == 'success' && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-x86_64-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save 80286 corpus cache
        if: ${{ always() && steps.corpus.outcome == 'success' && steps.corpus_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: x86jit-tests/vendor/80286/v1_real_mode
          key: ss286-${{ hashFiles('x86jit-tests/vendor/80286/fetch.sh') }}

      - name: Report status
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: >-
            nix=${{ steps.nix.outcome }}
            devshell=${{ steps.devshell.outcome }}
            corpus=${{ steps.corpus.outcome }}
            fmt=${{ steps.fmt.outcome }}
            guard=${{ steps.guard.outcome }}
            clippy=${{ steps.clippy.outcome }}
            cross-aarch64-unknown-freebsd=${{ steps.freebsd_aarch64.outcome }}
            cross-x86_64-unknown-freebsd=${{ steps.freebsd_x86_64.outcome }}
            deny=${{ steps.deny.outcome }}
            tests=${{ steps.tests.outcome }}
            release=${{ steps.release.outcome }}
            lane32=${{ steps.lane32.outcome }}
        run: ./scripts/ci-report-status.sh
