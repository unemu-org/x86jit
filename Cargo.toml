[workspace]
resolver = "2"
exclude = ["vendor/cranelift-jit"]
members = [
    "x86jit-core",
    "x86jit-cranelift",
    "x86jit-elf",
    "x86jit-tests",
    "x86jit-bench",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unemu-org/x86jit"
# Cranelift 0.135.8 requires Rust 1.95 (decision-17, phase 1).
rust-version = "1.95"

[workspace.dependencies]
# x86-64 decoder — core dependency (§15).
iced-x86 = "1.21"
# JIT backend — feature-gated in x86jit-cranelift (§15).
cranelift = "=0.135.8"
cranelift-jit = { package = "x86jit-cranelift-jit", version = "=0.135.8", path = "vendor/cranelift-jit" }
cranelift-module = "=0.135.8"
cranelift-native = "=0.135.8"
# Executable memory arena for the JIT code cache (W^X) (§15).
memmap2 = "0.9"
# ELF parsing for the loader helper (x86jit-elf) (§4.2).
goblin = "0.8"
# Test harness (x86jit-tests): RON vectors + the Unicorn differential oracle
# (testing.md). `serde` is also used by x86jit-bench for its result records.
serde = { version = "1", features = ["derive"] }
ron = "0.8"
hex = "0.4"
unicorn-engine = "2.1"
# JSON: the ISA compat-map artifact (x86jit-tests) and the per-commit benchmark
# records (x86jit-bench).
serde_json = "1"
# gzip: the SingleStepTests 80286 corpus ships one gzipped MOO file per opcode
# (x86jit-tests/src/ss286.rs), decompressed on load.
flate2 = "1"
# NativeOracle (x86jit-tests/src/native.rs): fork, execute the guest snippet on the
# real host CPU, capture the result out of a ucontext. x86-64/Linux only — the module
# is cfg-gated, the dependency is unconditional because it is tiny.
libc = "0.2"
# Internal crates. A `version` alongside `path` is required so `cargo publish` can
# rewrite path deps to registry deps (publish order: core → elf → cranelift), and it
# is what keeps `cargo deny check bans` from reading these as wildcard dependencies.
# `x86jit-tests` carries one for the second reason only: it is `publish = false`, so
# a downstream that wants its `reference` helper needs a git dependency.
x86jit-core = { path = "x86jit-core", version = "0.3.0" }
x86jit-cranelift = { path = "x86jit-cranelift", version = "0.3.0" }
x86jit-elf = { path = "x86jit-elf", version = "0.3.0" }
x86jit-tests = { path = "x86jit-tests", version = "0.3.0" }

# Tests run on the dev profile, the workspace at `opt-level 0`. The dependencies that
# do work at run time are optimized: the decoder, Cranelift and the JIT module, their
# containers, and the RON, JSON and gzip readers of the test data. An unoptimized
# Cranelift made the JIT-bound tests wait for their own compiler. The list is explicit:
# `package."*"` would also optimize the proc-macro and build-script crates, which cost
# build time and do nothing at run time. A crate missing from the list only runs
# slower. Debug assertions and overflow checks stay on, and an edit to a workspace
# crate rebuilds no dependency.
[profile.dev.package]
# The decoder.
iced-x86 = { opt-level = 3 }
# Cranelift, the vendored JIT module and their containers.
cranelift-assembler-x64 = { opt-level = 3 }
cranelift-bforest = { opt-level = 3 }
cranelift-bitset = { opt-level = 3 }
cranelift-codegen = { opt-level = 3 }
cranelift-codegen-shared = { opt-level = 3 }
cranelift-control = { opt-level = 3 }
cranelift-entity = { opt-level = 3 }
cranelift-frontend = { opt-level = 3 }
cranelift-module = { opt-level = 3 }
cranelift-native = { opt-level = 3 }
x86jit-cranelift-jit = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
gimli = { opt-level = 3 }
hashbrown = { opt-level = 3 }
smallvec = { opt-level = 3 }
rustc-hash = { opt-level = 3 }
bumpalo = { opt-level = 3 }
target-lexicon = { opt-level = 3 }
memchr = { opt-level = 3 }
# The readers of the test data: RON vectors, JSON records, the gzipped corpus.
serde = { opt-level = 3 }
serde_core = { opt-level = 3 }
serde_json = { opt-level = 3 }
ron = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
adler2 = { opt-level = 3 }
crc32fast = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }

# The measurement profile of `scripts/perf-campaign.sh` (decision-23 performance
# requirement). It is release with one codegen unit for the core and the bench, so
# that a change in one function does not move unrelated code between codegen
# units and shift the layout of hot paths it does not touch. Not for shipping.
[profile.perf]
inherits = "release"

[profile.perf.package.x86jit-core]
codegen-units = 1

[profile.perf.package.x86jit-bench]
codegen-units = 1
