[package]
edition = "2024"
rust-version = "1.95.0"
name = "x86jit-cranelift-jit"
version = "0.135.8"
authors = ["The Cranelift Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Modified fork of cranelift-jit 0.135.8 with the x86jit dual-address memory-provider integration; not the upstream crate"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/unemu-org/x86jit"
resolver = "2"

[features]
default = []
wasmtime-unwinder = ["dep:wasmtime-unwinder"]

[lib]
name = "cranelift_jit"
path = "src/lib.rs"

[[example]]
name = "jit-minimal"
path = "examples/jit-minimal.rs"

[[test]]
name = "basic"
path = "tests/basic.rs"

[dependencies.anyhow]
version = "1.0.103"
default-features = false

[dependencies.cranelift-codegen]
version = "0.135.8"
features = [
    "unwind",
    "std",
]
default-features = false

[dependencies.cranelift-control]
version = "0.135.8"
default-features = false

[dependencies.cranelift-entity]
version = "0.135.8"

[dependencies.cranelift-module]
version = "0.135.8"

[dependencies.cranelift-native]
version = "0.135.8"

[dependencies.libc]
version = "0.2.185"
default-features = true

[dependencies.log]
version = "0.4.28"
default-features = false

[dependencies.memmap2]
version = "0.9.11"

[dependencies.region]
version = "3.0.2"

[dependencies.target-lexicon]
version = "0.13.5"

[dependencies.wasmtime-jit-icache-coherence]
version = "=48.0.8"
package = "wasmtime-internal-jit-icache-coherence"

[dependencies.wasmtime-unwinder]
version = "=48.0.8"
features = ["cranelift"]
optional = true
package = "wasmtime-internal-unwinder"

[dev-dependencies.cranelift-entity]
version = "0.135.8"

[dev-dependencies.cranelift-frontend]
version = "0.135.8"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
]

[lints.clippy]
allow_attributes_without_reason = "warn"
clone_on_copy = "warn"
extra_unused_type_parameters = "warn"
from_over_into = "warn"
manual_strip = "warn"
map_clone = "warn"
multiple_bound_locations = "warn"
redundant_field_names = "warn"
uninlined_format_args = "warn"
unnecessary_cast = "warn"
unnecessary_fallible_conversions = "warn"
unnecessary_mut_passed = "warn"
unnecessary_to_owned = "warn"
useless_conversion = "warn"

[lints.clippy.all]
level = "allow"
priority = -1

[lints.rust]
trivial_numeric_casts = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(pulley_tail_calls)",
    "cfg(pulley_assume_llvm_makes_tail_calls)",
    "cfg(pulley_disable_interp_simd)",
    "cfg(arc_try_new)",
    "cfg(fuzzing)",
    "cfg(gc_zeal)",
]
