[package]
name = "x86jit-cranelift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Cranelift JIT backend for x86jit (feature-gated, optional)."
keywords = ["x86-64", "jit", "cranelift", "recompiler", "emulator"]
categories = ["emulators", "virtualization", "development-tools"]

[features]
# JIT is opt-in so the core can be built without pulling cranelift (§2, §15).
default = ["jit", "environment"]
# Legacy diagnostic environment and file access, additionally opt-in through API.
environment = ["x86jit-core/environment"]
jit = ["dep:cranelift", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:memmap2", "dep:region", "dep:libc", "dep:wasmtime-jit-icache-coherence"]

[dependencies]
x86jit-core = { path = "../x86jit-core", version = "0.3.0", default-features = false }
cranelift = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
region = { version = "=3.0.2", optional = true }

libc = { workspace = true, optional = true }
wasmtime-jit-icache-coherence = { package = "wasmtime-internal-jit-icache-coherence", version = "=48.0.8", optional = true }

[dev-dependencies]
iced-x86 = { workspace = true, features = ["code_asm"] }
x86jit-core = { path = "../x86jit-core", version = "0.3.0", default-features = false, features = ["test-hooks"] }
# Cross-host machine-code witnesses; production builds retain the host ISA only.
cranelift-codegen = { version = "=0.135.8", default-features = false, features = ["x86", "arm64"] }
libc.workspace = true
